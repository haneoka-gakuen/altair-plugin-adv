name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: altair-plugin-adv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out ADV plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: altair-plugin-adv
          persist-credentials: false

      - name: Check out Altair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair
          path: altair-plugin-adv/.dependencies/altair
          persist-credentials: false
          ref: cd4e44d0670df22fe2e8f8ae3ebab3ab8365766d

      - name: Check out Vega
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega
          path: altair-plugin-adv/.dependencies/vega
          persist-credentials: false
          ref: 2fa1b39c1176852db38a45b453c737e8e3439f5d

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: altair-plugin-adv/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: altair-plugin-adv
        run: pnpm install --no-frozen-lockfile

      - name: Build Vega protocol
        working-directory: altair-plugin-adv
        run: pnpm --filter @haneoka/vega-protocol build

      - name: Build Altair
        working-directory: altair-plugin-adv
        run: pnpm --filter @haneoka/altair build:core

      - name: Check package
        working-directory: altair-plugin-adv
        run: pnpm check

      - name: Inspect npm payload
        working-directory: altair-plugin-adv
        run: pnpm pack --dry-run
