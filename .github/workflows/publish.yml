name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: altair-plugin-adv-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out ADV plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: altair-plugin-adv
          persist-credentials: false

      - name: Check out Altair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair
          path: altair-plugin-adv/.dependencies/altair
          persist-credentials: false
          ref: cd4e44d0670df22fe2e8f8ae3ebab3ab8365766d

      - name: Check out Vega
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega
          path: altair-plugin-adv/.dependencies/vega
          persist-credentials: false
          ref: 2fa1b39c1176852db38a45b453c737e8e3439f5d

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version
        working-directory: altair-plugin-adv
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release-tag.mjs

      - name: Install dependencies
        working-directory: altair-plugin-adv
        run: pnpm install --no-frozen-lockfile

      - name: Build Vega protocol
        working-directory: altair-plugin-adv
        run: pnpm --filter @haneoka/vega-protocol build

      - name: Build Altair
        working-directory: altair-plugin-adv
        run: pnpm --filter @haneoka/altair build:core

      - name: Check package
        working-directory: altair-plugin-adv
        run: pnpm check

      - name: Publish package
        working-directory: altair-plugin-adv
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_name=$(node -p "require('./package.json').name.replaceAll('/', '-')")
          package_dir="$RUNNER_TEMP/$package_name"
          mkdir -p "$package_dir"
          pnpm pack --pack-destination "$package_dir"
          npm publish "$package_dir"/*.tgz --access public --provenance
