name: Bug report
description: Report a reproducible ADV authoring or conversion defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: "@haneoka/altair-plugin-adv 0.1.0"
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal project or ADV JSON
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
